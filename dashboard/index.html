<title>LINK. Management</title>
<style>
/* Layout: zwarte LINK.-balk met tabs bovenaan, zandkleurige werkvlakte eronder; overzicht = KPI-rij + twee kolommen (vandaag/aandacht | resultaten/projecten) */
:root {
  --bg: #e9e0cd;          /* LINK. zand */
  --surface: #f8f4eb;     /* kaart */
  --surface-2: #efe8d8;
  --line: #d9cfb8;
  --fg: #1c2230;          /* inkt */
  --muted: #6f6a5c;
  --faint: #a79f8b;
  --accent: #38b6ff;      /* LINK.-blauw */
  --accent-ink: #0b6fa8;
  --bar: #000000;
  --bar-fg: #ffffff;
  --ok: #2f8a57;  --ok-bg: #dcefe1;
  --warn: #a8670f; --warn-bg: #f6e6c8;
  --bad: #b8333f; --bad-bg: #f5d9d9;
  --info-bg: #dcecf6;
  --shadow: 0 1px 0 rgba(28,34,48,.06), 0 8px 24px -16px rgba(28,34,48,.25);
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-serif: Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --surface: #1b1e23; --surface-2: #23272d; --line: #30343b;
  --fg: #ece5d5; --muted: #a9a290; --faint: #7b7567; --accent: #38b6ff; --accent-ink: #7fd0ff;
  --bar: #000000; --bar-fg: #ffffff;
  --ok: #6cc893; --ok-bg: #19352a; --warn: #e3ad5a; --warn-bg: #3a2e18; --bad: #ef7d86; --bad-bg: #3d1f23; --info-bg: #15303f;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1b1e23; --surface-2: #23272d; --line: #30343b;
  --fg: #ece5d5; --muted: #a9a290; --faint: #7b7567; --accent: #38b6ff; --accent-ink: #7fd0ff;
  --bar: #000000; --bar-fg: #ffffff;
  --ok: #6cc893; --ok-bg: #19352a; --warn: #e3ad5a; --warn-bg: #3a2e18; --bad: #ef7d86; --bad-bg: #3d1f23; --info-bg: #15303f;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.6);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.num, td.n, .tab-num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Topbalk */
.topbar { background: var(--bar); color: var(--bar-fg); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.topbar-in { max-width: 1280px; margin: 0 auto; padding-inline: 16px; display: flex; align-items: center; gap: 24px; min-height: 56px; }
.logo { font-weight: 800; font-size: 22px; letter-spacing: -0.6px; white-space: nowrap; }
.logo .dot { color: var(--accent); }
.logo small { font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: 14px; color: #bdbdbd; letter-spacing: 0; margin-left: 8px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }

.tab { background: none; border: 0; color: #bdbdbd; padding: 18px 12px 16px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; font-weight: 600; font-size: 13.5px; }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.eyebrow { color: var(--accent-ink); font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }

/* Knoppen */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }

.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* KPI-rij */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--surface); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.kpi.hl { background: var(--bar); color: #fff; }

.kpi.hl .val { color: var(--accent); }
.kpi .foot { font-size: 12px; color: var(--muted); margin-top: 4px; }
.kpi.hl .foot { color: #b3b3b3; }

.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }

.stack { display: grid; gap: 16px; min-width: 0; }

.card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }

.empty { color: var(--muted); padding: 18px 16px 20px; font-size: 13px; }
.empty strong { color: var(--fg); }

/* Lijsten */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .main { flex: 1; min-width: 0; }
.list .title { font-weight: 600; }
.list .meta { color: var(--muted); font-size: 12.5px; }
.list .right { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stripe { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
.stripe.bad { background: var(--bad); } .stripe.warn { background: var(--warn); } .stripe.info { background: var(--accent); } .stripe.ok { background: var(--ok); }

/* Tabellen */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

/* Pills */
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted); }

.dotc { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* Planning */

.weeknav .wk { font-weight: 800; font-size: 15px; min-width: 150px; text-align: center; }
.plan-wrap { overflow-x: auto; }
.plan { display: grid; grid-template-columns: 170px repeat(7, minmax(118px, 1fr)); min-width: 1000px; }
.plan > div { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); padding: 8px; min-height: 64px; }
.plan .ph { min-height: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; background: var(--surface-2); }

.plan .who { border-left: 0; font-weight: 700; }
.plan .who .meta { font-weight: 400; color: var(--muted); font-size: 12px; }
.plan .cell { display: flex; flex-direction: column; gap: 4px; position: relative; }
.plan .cell.weekend { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.plan .cell.today { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.chip { border: 0; text-align: left; border-radius: 6px; padding: 5px 7px; font-size: 12px; line-height: 1.3; cursor: pointer; background: color-mix(in srgb, var(--pc) 16%, var(--surface)); border-left: 4px solid var(--pc); width: 100%; }
.chip b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip span { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.gepland { background: var(--surface); outline: 1px dashed color-mix(in srgb, var(--pc) 70%, transparent); outline-offset: -1px; }
.chip.afgemeld { opacity: .5; text-decoration: line-through; }
.add { border: 1px dashed var(--line); background: none; color: var(--faint); border-radius: 6px; font-size: 16px; line-height: 1; padding: 4px; cursor: pointer; opacity: 0; transition: opacity .12s; }
.cell:hover .add, .add:focus-visible { opacity: 1; }
@media (hover: none) { .add { opacity: .7; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; padding: 10px 16px 14px; color: var(--muted); }
.legend b { color: var(--fg); font-variant-numeric: tabular-nums; }

/* Grafiek */
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .val { fill: var(--fg); font-weight: 700; }
.chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); padding: 0 16px 14px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Subtabs + filters */
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(10,12,16,.55); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 640px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); }
.modal.wide { max-width: 880px; }
.modal-head { padding: 18px 20px 6px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }

.modal-foot { padding: 14px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.modal-foot .spacer { flex: 1; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .form { grid-template-columns: minmax(0, 1fr); } }
label.f { display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; min-width: 0; }
label.f .hint { font-weight: 400; color: var(--faint); }
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--fg); min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--fg); font-weight: 400; }
.checks label { display: inline-flex; gap: 6px; align-items: center; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.facts div { font-size: 12px; color: var(--muted); }
.facts b { display: block; font-size: 17px; color: var(--fg); font-variant-numeric: tabular-nums; }
.notice { border-radius: 8px; padding: 9px 12px; font-size: 13px; margin: 0 0 12px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }

.notice.info { background: var(--info-bg); color: var(--accent-ink); }

/* Factuurregels */
.lines input { padding: 6px 8px; font-size: 13px; }
.lines td { padding: 6px 6px; }
.lines td:first-child { padding-left: 0; }
.totals { margin-left: auto; width: min(320px, 100%); font-size: 13.5px; margin-top: 10px; }

.totals .grand { font-weight: 800; font-size: 16px; border-top: 1px solid var(--fg); margin-top: 4px; padding-top: 7px; }

/* Factuurvoorbeeld */
.inv { border: 1px solid var(--line); border-radius: 10px; padding: 20px; background: var(--bg); }
.inv-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.inv .logo { color: var(--fg); }

/* Upload */
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 16px 12px; }
.toolbar select, .toolbar input { width: auto; }
.muted { color: var(--muted); }
.briefs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; margin-bottom: 20px; align-items: start; }
.brief .card-body { display: grid; gap: 12px; }
.blk { border-left: 4px solid var(--pc, var(--faint)); background: var(--surface-2); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 13px; }

@media (max-width: 560px) { .fb-cijfers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bt { display: grid; grid-template-columns: 64px 1fr 36px minmax(0, 150px); gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; font-variant-numeric: tabular-nums; }

.sl { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--faint); vertical-align: middle; }
.sl.groen { background: var(--ok); } .sl.oranje { background: var(--warn); } .sl.rood { background: var(--bad); }
table.ov td { vertical-align: middle; } table.ov td:first-child { width: 28px; padding-right: 0; }
table.ov .bar-mini { margin-top: 4px; margin-left: auto; width: 90px; }
tr.dim td { opacity: .55; }

</style>

<script>
(() => {
'use strict';

/* ======================================================================
   Datamodel — alle collecties verwijzen naar elkaar via id's:
   klanten ← projecten.klantId
   projecten ← diensten.projectId, resultaten.projectId, factuurregels.projectId
   zzp ← diensten.zzpId, facturen(inkoop).partijId, resultaten.perAgent[*].zzpId
   diensten → factuurVerkoopId / factuurInkoopId (voorkomt dubbel factureren)
   ====================================================================== */
const COLL = ['klanten', 'projecten', 'zzp', 'diensten', 'facturen', 'resultaten', 'dagstart', 'sync', 'feedback'];
const S = { klanten: {}, projecten: {}, zzp: {}, diensten: {}, facturen: {}, resultaten: {}, dagstart: {}, sync: {}, feedback: {}, loaded: new Set() };
const UI = { tab: 'overzicht', weekStart: mondayOf(new Date()), factSoort: 'verkoop', factStatus: 'alle', projFilter: 'actief', dsOpen: new Set(), beheer: 'opdrachtgevers', toonAlles: false };
let store = null;
let downloads = null;

const TABS = [
  ['overzicht', 'Overzicht'], ['dagstart', 'Dagstart'], ['planning', 'Planning'], ['facturen', 'Facturen'], ['beheer', 'Beheer'],
];
const PCOLORS = ['#38b6ff', '#e8833a', '#2f9e6b', '#a35bd6', '#d64f6b', '#c9a227', '#3a8f9e', '#8a7a5c', '#5468d4', '#c25a2b'];
const CODES = { 100: 'Afspraak', 101: 'Overdracht', 200: 'Geen interesse', 201: 'Al voorzien', 202: 'Te klein/niet passend', 300: 'Onjuist nummer', 400: 'Geen gehoor', 401: 'Voicemail', 402: 'Bezet', 500: 'Terugbelafspraak', 501: 'Informatiemail', 502: 'Terugbelverzoek' };
const WARM = [100, 101, 500], SPOKEN = [100, 101, 200, 201, 202, 500];

/* ---------------- helpers ---------------- */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseISO(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { jaar: t.getUTCFullYear(), week: Math.ceil(((t - y0) / 86400000 + 1) / 7) };
}
function weekMonday(jaar, week) { const jan4 = new Date(jaar, 0, 4); return addDays(mondayOf(jan4), (week - 1) * 7); }
function wkKey(j, w) { return j * 100 + w; }
const TODAY = iso(new Date());
const MONTHS = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
const DAYS = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
function fmtD(s, withYear) { const d = parseISO(s); if (!d) return '–'; return DAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + (withYear ? ' ' + d.getFullYear() : ''); }
function fmtDL(s) { const d = parseISO(s); if (!d) return '–'; return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
const EUR = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' });
const EUR0 = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
function eur(n, round) { return (round ? EUR0 : EUR).format(n || 0); }
function nf(n, dec = 0) { return (n || 0).toLocaleString('nl-NL', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function num(v) { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; }
function mins(t) { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); }
function uren(d) { return Math.max(0, (mins(d.eind) - mins(d.start) - (num(d.pauze) || 0)) / 60); }
function sortBy(arr, f) { return arr.slice().sort((a, b) => { const x = f(a), y = f(b); return x < y ? -1 : x > y ? 1 : 0; }); }
function list(c) { return Object.entries(S[c]).map(([id, v]) => ({ id, ...v })); }
function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function projLabel(id) { const p = project(id); if (!p) return id ? 'Onbekend project' : 'Nog in te delen'; const k = klant(p.klantId); return p.naam + (k && k.naam !== p.naam ? ' · ' + k.naam : ''); }
function tariefVerkoop(pid) { const p = project(pid); if (!p) return 0; return num(p.tariefUur) || num(klant(p.klantId)?.tariefUur); }
function prijsLabel(pid) { const p = project(pid); if (!p) return ''; if (num(p.retainer)) return eur(p.retainer, true) + ' / ' + (num(p.periodeWeken) || 4) + ' wk' + (num(p.prijsPerAfspraak) ? ' + ' + eur(p.prijsPerAfspraak, true) : ''); if (tariefVerkoop(pid)) return eur(tariefVerkoop(pid)) + '/u'; if (num(p.prijsPerAfspraak)) return eur(p.prijsPerAfspraak, true) + '/resultaat'; return ''; }
function gefactureerdProject(pid) { const p = project(pid); return list('facturen').filter(f => f.soort === 'verkoop' && f.status !== 'concept' && ((f.regels || []).some(r => r.projectId === pid) || (!(f.regels || []).some(r => r.projectId) && f.partijId === p?.klantId))).reduce((a, f) => a + ((f.regels || []).some(r => r.projectId) ? (f.regels || []).filter(r => r.projectId === pid).reduce((b, r) => b + num(r.aantal) * num(r.prijs), 0) : factTotals(f).sub), 0); }
// resultaat volgens wat er voor deze opdrachtgever telt
function telt(pid, r) { const t = project(pid)?.teltAls || '100+101'; return (t.includes('100') ? num(r.afspraak) : 0) + (t.includes('101') ? num(r.overdracht) : 0); }

function factTotals(f) { const sub = (f.regels || []).reduce((a, r) => a + num(r.aantal) * num(r.prijs), 0); const btw = sub * num(f.btwPct) / 100; return { sub, btw, tot: sub + btw }; }
function factStatus(f) {

  if (f.soort === 'inkoop' && f.status === 'verstuurd' && f.vervaldatum && f.vervaldatum <= TODAY) return 'betaald';
  if (f.status === 'verstuurd' && f.vervaldatum && f.vervaldatum < TODAY) return 'te laat'; return f.status || 'concept'; }
function partijNaam(f) { return f.soort === 'inkoop' ? (zzp(f.partijId)?.naam || 'Onbekende zzp\'er') : (klant(f.partijId)?.naam || 'Onbekende klant'); }

  return sortBy(list('projecten').filter(p => p.status === 'actief').map(p => ({ p, x: periodePlan(p) })), q => (q.x.nogNiet ? '9' : ord[q.x.stoplicht]) + (klant(q.p.klantId)?.naam || q.p.naam)).map(q => q.p);
}

function huidigeWeek() { return isoWeek(new Date()); }

/* ---------------- opslag ---------------- */
function localStore() {
  const KEY = 'link-management-v1';
  let data = null;
  try { data = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { data = null; }
  data = data || {}; COLL.forEach(c => { data[c] = data[c] || {}; });
  const subs = {};
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* geen opslag */ } };
  const emit = c => subs[c] && subs[c]({ ...data[c] });
  return {
    mode: 'lokaal',
    newId: () => 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    subscribe(c, cb) { subs[c] = cb; cb({ ...data[c] }); },
    async save(c, id, obj) { data[c][id] = obj; persist(); emit(c); },
    async remove(c, id) { delete data[c][id]; persist(); emit(c); },
  };
}
function dbStore(db) {
  return {
    mode: 'gedeeld',
    newId: () => db.collection('klanten').doc().id,
    subscribe(c, cb) {
      let q = db.collection(c);
      q = c === 'diensten' ? q.orderBy('datum', 'desc').limit(1000) : q.limit(1000);
      q.onSnapshot(s => { const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); cb(o); },
        e => toast('Verbinding met ' + c + ' verbroken (' + e.code + '). Herlaad de pagina.', true));
    },
    async save(c, id, obj) { await withRetry(() => db.collection(c).doc(id).set(obj)); },
    async remove(c, id) { await withRetry(() => db.collection(c).doc(id).delete()); },
  };
}
async function withRetry(fn) {
  try { return await fn(); } catch (e) {
    if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
    throw e;
  }
}
function clean(obj) { const o = {}; for (const [k, v] of Object.entries(obj)) if (k !== 'id' && v !== undefined) o[k] = v; return o; }
async function save(c, id, obj) {
  try { await store.save(c, id, clean(obj)); return true; }
  catch (e) { toast(saveErr(e), true); return false; }
}
async function remove(c, id) {
  try { await store.remove(c, id); return true; } catch (e) { toast(saveErr(e), true); return false; }
}
function saveErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return 'Opslaan geweigerd: je hebt alleen leesrechten op dit dashboard.';
  if (c === 'quota_exceeded') return 'De opslag is vol. Verwijder oude diensten of resultaten.';
  if (c === 'resource_exhausted') return 'Even te veel tegelijk. Probeer het over een paar seconden opnieuw.';
  return 'Opslaan mislukt' + (c ? ' (' + c + ')' : '') + '. Probeer het opnieuw.';
}

let modalCleanup = null;

document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.overlay')) closeModal(); });

function opt(v, label, sel) { return '<option value="' + esc(v) + '"' + (String(sel) === String(v) ? ' selected' : '') + '>' + esc(label) + '</option>'; }
function field(f, val) {

  const cls = 'f' + (f.full ? ' full' : '');

  if (f.type === 'select') input = '<select id="' + id + '" name="' + f.k + '">' + f.options.map(([v, l]) => opt(v, l, val ?? f.def ?? '')).join('') + '</select>';
  else if (f.type === 'textarea') input = '<textarea id="' + id + '" name="' + f.k + '" placeholder="' + esc(f.ph || '') + '">' + esc(val ?? '') + '</textarea>';
  else input = '<input id="' + id + '" name="' + f.k + '" type="' + (f.type || 'text') + '"' + (f.type === 'number' ? ' step="any" inputmode="decimal"' : '') + ' value="' + esc(val ?? f.def ?? '') + '" placeholder="' + esc(f.ph || '') + '"' + (f.req ? ' required' : '') + '>';

  fields.forEach(f => { const el = form.elements[f.k]; if (!el) return; o[f.k] = f.type === 'number' ? (el.value === '' ? null : num(el.value)) : el.value.trim(); });

function confirmInline(btn, label, onYes) {

  wrap.innerHTML = esc(label) + ' <button type="button" class="btn small danger">Ja, verwijderen</button><button type="button" class="btn small">Annuleren</button>';

function go(tab) { if (BEHEER[tab]) { UI.beheer = BEHEER[tab]; tab = 'beheer'; } UI.tab = tab; try { history.replaceState(null, '', '#' + tab); } catch (e) { /* frame */ } try { localStorage.setItem('link-tab', tab); } catch (e) { /* */ } renderTabs(); render(); window.scrollTo(0, 0); }

let renderQueued = false;

  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderNow(); });
}
function renderNow() {
  const app = document.getElementById('app');

  const y = window.scrollY;
  const ae = document.activeElement, keep = ae && ae.id && app.contains(ae) && /^(TEXTAREA|INPUT)$/.test(ae.tagName) ? { id: ae.id, v: ae.value, s: ae.selectionStart, e: ae.selectionEnd } : null;

  window.scrollTo(0, y);

function berekenAandacht() {
  const items = [];
  const facts = list('facturen');
  facts.filter(f => factStatus(f) === 'te laat').forEach(f => items.push({ lvl: 'bad', t: (f.soort === 'inkoop' ? 'Inkoopfactuur ' : 'Factuur ') + (f.nummer || '') + ' is over de vervaldatum', m: partijNaam(f) + ' · ' + eur(factTotals(f).tot) + ' · verviel ' + fmtD(f.vervaldatum), act: 'factuur:' + f.id }));
  const zonderProj = dienstenVan(d => !d.projectId && d.status !== 'afgemeld' && d.datum >= TODAY && d.datum <= iso(addDays(mondayOf(new Date()), 13)));
  if (zonderProj.length) items.push({ lvl: 'warn', t: zonderProj.length + (zonderProj.length === 1 ? ' dienst' : ' diensten') + ' zonder opdrachtgever (komende 2 weken)', m: 'Deel ze in via de dagstart of de planning, dan rekent de verdeling mee.', act: 'tab:planning:' + sortBy(zonderProj, d => d.datum)[0].datum });
  const openPast = dienstenVan(d => d.status === 'gepland' && d.datum < TODAY);
  if (openPast.length) items.push({ lvl: 'warn', t: openPast.length + (openPast.length === 1 ? ' dienst' : ' diensten') + ' in het verleden nog niet bevestigd', m: 'Zet ze op gewerkt of afgemeld, dan kloppen uren en facturen.', act: 'tab:planning:' + sortBy(openPast, d => d.datum)[0].datum });
  const nfk = {};
  dienstenVan(d => d.status === 'gewerkt' && !d.factuurVerkoopId).forEach(d => { const p = project(d.projectId); if (!p) return; const k = p.klantId; nfk[k] = nfk[k] || { u: 0, v: 0, oud: d.datum }; nfk[k].u += uren(d); nfk[k].v += uren(d) * tariefVerkoop(d.projectId); if (d.datum < nfk[k].oud) nfk[k].oud = d.datum; });
  Object.entries(nfk).filter(([, x]) => x.v > 0).forEach(([k, x]) => items.push({ lvl: x.oud.slice(0, 7) < TODAY.slice(0, 7) ? 'warn' : 'info', t: nf2(x.u) + ' uur nog te factureren aan ' + (klant(k)?.naam || 'onbekende klant'), m: eur(x.v) + ' excl. btw · sinds ' + fmtD(x.oud), act: 'newfact:verkoop:' + k }));
  list('projecten').filter(p => p.status === 'actief' && !prijsLabel(p.id)).forEach(p => items.push({ lvl: 'warn', t: 'Geen prijsafspraak voor ' + p.naam, m: 'Vul een fee, prijs per resultaat of uurtarief in, anders blijft de factuur leeg.', act: 'project:' + p.id }));
  list('projecten').filter(p => p.status === 'actief' && p.testEinde && p.testEinde >= iso(addDays(new Date(), -7)) && p.testEinde <= iso(addDays(new Date(), 21))).forEach(p => items.push({ lvl: 'info', t: 'Test/pilot ' + p.naam + (p.testEinde < TODAY ? ' is afgelopen' : ' loopt af') + ' op ' + fmtD(p.testEinde), m: 'Plan de evaluatie en bespreek verlenging.', act: 'project:' + p.id }));
  list('zzp').filter(z => z.status !== 'inactief' && z.type !== 'eigenaar' && !num(z.uurtarief)).forEach(z => items.push({ lvl: 'warn', t: 'Geen uurtarief voor ' + z.naam, m: 'Nodig voor inkoopfacturen en marge.', act: 'zzp:' + z.id }));
  const ws = iso(mondayOf(new Date())), we = iso(addDays(mondayOf(new Date()), 6));
  list('projecten').filter(p => p.status === 'actief' && !periodePlan(p).nogNiet).forEach(p => {
    if (!dienstenVan(d => d.projectId === p.id && d.datum >= ws && d.datum <= we && d.status !== 'afgemeld').length)
      items.push({ lvl: 'info', t: p.naam + ' heeft deze week geen bellers ingepland', m: klant(p.klantId)?.naam || '', act: 'plan:' + p.id });
  });
  const vw = vorigeWeek();
  list('projecten').filter(p => p.status === 'actief').forEach(p => {
    const heeftUren = dienstenVan(d => d.projectId === p.id && d.status === 'gewerkt' && isoWeek(parseISO(d.datum)).week === vw.week && isoWeek(parseISO(d.datum)).jaar === vw.jaar).length;
    const heeftRes = list('resultaten').some(r => r.projectId === p.id && r.jaar === vw.jaar && r.week === vw.week);
    if (heeftUren && !heeftRes) items.push({ lvl: 'info', t: 'Belresultaten week ' + vw.week + ' ontbreken voor ' + p.naam, m: 'Upload de belexport, dan staat de rapportage klaar.', act: 'tab:resultaten' });
  });
  const order = { bad: 0, warn: 1, info: 2 };
  return sortBy(items, i => order[i.lvl]);
}
function nf2(u) { return nf(u, u % 1 ? 1 : 0); }

  ];

function barChart(cats, series, opts = {}) {

    let acc = 0;
    const x0 = groups === 2 ? cx - bw - 1 : cx - bw / 2;
    series.filter(s => s.stack !== false).forEach(s => {
      const v = s.vals[i]; if (!v) return;
      g += '<rect x="' + x0 + '" y="' + y(acc + v) + '" width="' + bw + '" height="' + (y(acc) - y(acc + v)) + '" style="fill:' + s.color + '"><title>' + esc(s.name + ': ' + (opts.fmt ? opts.fmtFull(v) : v)) + '</title></rect>';

    series.filter(s => s.stack === false).forEach(s => {
      const v = s.vals[i]; if (!v) return;
      g += '<rect x="' + (cx + 1) + '" y="' + y(v) + '" width="' + bw + '" height="' + (y(0) - y(v)) + '" style="fill:' + s.color + '"><title>' + esc(s.name + ': ' + (opts.fmt ? opts.fmtFull(v) : v)) + '</title></rect>';

    const base = { ...(id ? S.diensten[id] : {}), zzpId: f.zzpId.value, projectId: f.projectId.value, datum: f.datum.value, start: f.start.value, eind: f.eind.value, pauze: num(f.pauze.value), status: f.status.value, notitie: f.notitie.value.trim(), gewijzigd: new Date().toISOString() };

  else if (!rate) status = { k: '', t: 'tempo onbekend' };

// Bellers doen koude acquisitie. Bevestigen, voorbereiden en opvolgen van gemaakte afspraken en leads gebeurt aan de achterkant (Hens).
const ACHTERKANT = /(bevestig|voorbereid|(^|[^a-z])afspra(ak|ken) met|kennismakingsbezoek|terugkoppeling|nagaan of|punten van .+ (naar|sturen)|met merel|kortingscode .*bestel)/i;
function koudeFocus(p) { return (p?.inzicht?.focus || []).filter(f => !ACHTERKANT.test(f)); }
function achterkantFocus(p) { return (p?.inzicht?.focus || []).filter(f => ACHTERKANT.test(f)); }
function bellerStats(zid, weken = 4) {
  const vanaf = iso(addDays(mondayOf(new Date()), -7 * (weken - 1) - 7));
  const agg = { pog: 0, regels: 0, gesproken: 0, res: 0 };
  const team = { pog: 0, regels: 0, gesproken: 0, res: 0 };
  list('resultaten').filter(r => iso(weekMonday(r.jaar, r.week)) >= vanaf).forEach(r => Object.values(r.perAgent || {}).forEach(a => {
    const res = telt(r.projectId, a);
    for (const t of a.zzpId === zid ? [agg, team] : [team]) { t.pog += num(a.pogingen); t.regels += num(a.regels); t.gesproken += num(a.gesproken); t.res += res; }
  }));
  const urenB = dienstenVan(d => d.zzpId === zid && d.status === 'gewerkt' && d.datum >= vanaf).reduce((a, d) => a + uren(d), 0);
  const f = t => ({ ...t, gesprPct: t.regels ? 100 * t.gesproken / t.regels : 0, per100: t.pog ? 100 * t.res / t.pog : 0, perGespr: t.gesproken ? 100 * t.res / t.gesproken : 0 });
  return { b: f(agg), t: f(team), uren: urenB, vanaf };
}
function bellerTips(s) {
  const tips = [];

  if (s.b.per100 >= s.t.per100 * 1.1) tips.push('Sterk: ' + nf(s.b.per100, 1) + ' resultaten per 100 pogingen, team ' + nf(s.t.per100, 1) + '. Houd deze aanpak vast en deel wat werkt in de dagstart.');
  if (s.b.gesprPct < s.t.gesprPct - 8) tips.push('Je spreekt minder beslissers dan het team (' + nf(s.b.gesprPct) + '% tegen ' + nf(s.t.gesprPct) + '%). Vraag bij de receptie direct naar de naam en vaste werkdagen van de beslisser en bel dan gericht terug.');
  if (s.b.perGespr < s.t.perGespr * 0.7 && s.b.gesproken >= 20) tips.push('Veel gesprekken, weinig resultaat (' + nf(s.b.perGespr, 1) + '% van de gesprekken tegen ' + nf(s.t.perGespr, 1) + '%). Sluit elk goed gesprek af met een concreet voorstel: "Zal ik dinsdag 10:00 of donderdag 14:00 inplannen?", in plaats van alleen info te mailen.');
  if (s.uren >= 6) { const pu = s.b.res / s.uren; tips.push(pu >= 1 / 3 ? 'Norm gehaald: ' + nf(pu * 3, 1) + ' resultaat per blok van 3 uur (norm 1).' : 'Onder de norm: ' + nf(pu * 3, 1) + ' resultaat per blok van 3 uur (norm 1). Pak de warmste terugbelafspraken eerst.'); }
  if (!tips.length) tips.push('In lijn met het team. Doel vandaag: één resultaat per blok van 3 uur.');
  return tips;
}
function briefingData(zid, refI, plans) {
  const ds = sortBy(dienstenVan(d => d.zzpId === zid && d.datum === refI && d.status !== 'afgemeld'), d => d.start);
  const blokken = ds.map(d => {
    const p = d.projectId ? { id: d.projectId, ...project(d.projectId) } : null;
    const q = p && plans.find(q => q.p.id === p.id);
    const b = q?.x.bellers.find(b => b.zid === zid);
    const aandeel = b && b.vandaag ? uren(d) / b.vandaag : 1;
    return { d, p, q, doel: b ? b.doelVandaag * aandeel : 0, pog: b?.pogVandaag ? b.pogVandaag * aandeel : null };
  });

function parseCSV(text, sep) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

  if (text.includes(String.fromCharCode(0xFFFD))) text = new TextDecoder('windows-1252').decode(buf);
  let rows;
  if (/<table/i.test(text)) {
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const tbl = doc.querySelector('table');
    const trs = [...tbl.querySelectorAll('tr')].map(tr => [...tr.querySelectorAll('th,td')].map(c => c.textContent.replace(/ /g, ' ').trim()));
    const head = trs[0];
    rows = trs.slice(1).filter(r => r.length >= head.length - 1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
  } else if (/management module/i.test(text) && text.length < 6000) {
    throw new Error('Dit is een lege export (alleen de "Management module"-wrapper zonder data). Exporteer opnieuw uit Belstat.');
  } else {
    const first = text.split(/\r?\n/)[0];
    const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
    const raw = parseCSV(text, sep);
    if (raw.length && raw[0].some(c => /resultaatcode/i.test(c))) { const head = raw[0].map(h => h.trim()); rows = raw.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? '']))); }
    else rows = raw.map(r => Object.fromEntries(CSV_COLS.map((h, i) => [h, r[i] ?? ''])));
  }
  if (!rows || !rows.length) throw new Error('Geen regels gevonden in ' + file.name + '.');
  const out = rows.map(r => {
    const g = k => { const key = Object.keys(r).find(x => x.toLowerCase() === k.toLowerCase()); return key ? String(r[key]).trim() : ''; };
    const m = g('Resultaatcode').replace('MAX-', '').match(/\d+/);
    return { project: g('Naam project'), agent: g('Naam agent'), bedrijf: g('Bedrijf'), dt: g('Contactmoment datum & tijd'), campagne: g('Campagne') || g('Projectcode'), code: m ? +m[0] : null };
  }).filter(r => r.code !== null);
  if (!out.length) throw new Error('Geen resultaatcodes gevonden. Is dit wel een belexport?');
  return out;
}
function funnelOf(rows) {
  const uniq = codes => new Set(rows.filter(r => codes.includes(r.code)).map(r => r.bedrijf)).size;
  return { pogingen: rows.length, gesproken: uniq(SPOKEN), warm: uniq(WARM), afspraak: uniq([100]), overdracht: uniq([101]), terugbel: uniq([500]), infomail: uniq([501]), terugbelverzoek: uniq([502]), geenInteresse: rows.filter(r => [200, 201, 202].includes(r.code)).length };
}
function parseDt(s) {
  let m = s.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/); if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = s.match(/(\d{4})-(\d{2})-(\d{2})/); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}
async function handleFiles(files) {
  for (const file of files) {
    let rows;
    try { rows = await readExport(file); } catch (e) { toast(e.message, true); continue; }
    await new Promise(res => importModal(file.name, rows, res));
  }
}
function importModal(filename, rows, done) {
  // week = meest voorkomende ISO-week in de contactmomenten
  const wc = {};
  rows.forEach(r => { const d = parseDt(r.dt); if (!d) return; const w = isoWeek(d); const k = w.jaar + '-' + w.week; wc[k] = (wc[k] || 0) + 1; });
  const top = Object.entries(wc).sort((a, b) => b[1] - a[1])[0];
  const def = top ? { jaar: +top[0].split('-')[0], week: +top[0].split('-')[1] } : vorigeWeek();
  // klant bepalen: Campagne/Projectcode → klant → project; anders "Naam project" → Belstat-naam. Nooit gokken op doelgroep.
  const camp = [...new Set(rows.map(r => r.campagne).filter(Boolean))];
  const pnames = [...new Set(rows.map(r => r.project).filter(Boolean))];
  let guess = '', reden = '';
  const ps = list('projecten');
  const byDialer = ps.find(p => p.dialerNaam && (camp.concat(pnames)).some(n => norm(n) === norm(p.dialerNaam)));
  if (byDialer) { guess = byDialer.id; reden = 'herkend via de Belstat-naam van het project'; }
  else if (camp.length === 1) {
    const k = list('klanten').find(k => norm(k.naam) === norm(camp[0]) || norm(camp[0]).includes(norm(k.naam)) || norm(k.naam).includes(norm(camp[0])));
    const kp = k ? ps.filter(p => p.klantId === k.id && p.status === 'actief') : [];
    if (kp.length === 1) { guess = kp[0].id; reden = 'herkend via Campagne "' + camp[0] + '"'; }
  }
  const fu = funnelOf(rows);
  const agents = {};
  rows.forEach(r => { const a = r.agent || 'Onbekend'; (agents[a] = agents[a] || []).push(r); });
  const zmatch = a => list('zzp').find(z => norm(z.naam) === norm(a) || norm(a).includes(norm(z.naam)) && norm(z.naam).length > 3);
  const m = openModal('<form id="imp"><div class="modal-head"><div><div class="eyebrow">Belexport inlezen</div><h2>' + esc(filename) + '</h2></div><button type="button" class="x" data-act="close" aria-label="Sluiten">×</button></div><div class="modal-body">'
    + '<p class="sub" style="margin-top:0">' + rows.length + ' contactmomenten · Naam project: <b>' + esc(pnames.join(', ') || '–') + '</b> · Campagne: <b>' + esc(camp.join(', ') || 'ontbreekt') + '</b></p>'
    + (guess ? '<p class="notice info">Project ' + esc(reden) + '. Controleer het even.</p>' : '<p class="notice warn">De klant is niet zeker uit de export af te leiden' + (camp.length ? '' : ' (geen Campagne-kolom)') + '. Kies zelf het juiste project. Twee exports met hetzelfde SBI-thema kunnen verschillende klanten zijn.</p>')
    + '<div class="form"><label class="f full" for="imp-p">Project<select id="imp-p" name="p" required>' + opt('', 'Kies het project…', guess) + sortBy(ps, p => projLabel(p.id)).map(p => opt(p.id, projLabel(p.id), guess)).join('') + '</select></label>'
    + '<label class="f" for="imp-j">Jaar<input id="imp-j" name="j" type="number" value="' + def.jaar + '"></label><label class="f" for="imp-w">Week<input id="imp-w" name="w" type="number" min="1" max="53" value="' + def.week + '"></label></div>'
    + '<div class="facts" style="margin-top:14px"><div><b>' + fu.pogingen + '</b>contactpogingen</div><div><b>' + fu.gesproken + '</b>bedrijven gesproken</div><div><b>' + fu.warm + '</b>warme uitkomst</div><div><b>' + fu.afspraak + '</b>afspraak (100)</div><div><b>' + fu.overdracht + '</b>overdracht (101)</div><div><b>' + fu.terugbel + '</b>terugbelafspraak (500)</div></div>'
    + '<h2 style="margin:4px 0 6px">Per beller</h2><div class="tbl-wrap"><table><thead><tr><th>Naam agent</th><th>Zzp\'er</th><th class="n">Pogingen</th><th class="n">Gesproken</th><th class="n">Afspr.</th><th class="n">Overdr.</th></tr></thead><tbody>'
    + Object.entries(agents).map(([a, rr]) => { const z = zmatch(a), af = funnelOf(rr); return '<tr><td>' + esc(a) + '</td><td>' + (z ? '<span class="pill ok">' + esc(z.naam) + '</span>' : '<span class="pill">niet gekoppeld</span>') + '</td><td class="n">' + af.pogingen + '</td><td class="n">' + af.gesproken + '</td><td class="n">' + af.afspraak + '</td><td class="n">' + af.overdracht + '</td></tr>'; }).join('')
    + '</tbody></table></div><p class="sub" id="imp-name"></p></div><div class="modal-foot"><span class="spacer"></span><button type="button" class="btn" data-act="close">Overslaan</button><button type="submit" class="btn primary">Opslaan</button></div></form>', { wide: true });
  modalCleanup = done;
  const f = m.querySelector('form');
  const nameUpd = () => { const p = project(f.p.value); const k = klant(p?.klantId); const ex = list('resultaten').find(r => r.projectId === f.p.value && r.jaar === num(f.j.value) && r.week === num(f.w.value)); m.querySelector('#imp-name').innerHTML = (k ? 'Hoort bij rapportage: <b>Rapportage ' + esc(k.naam) + ' wk ' + esc(f.w.value) + '.pdf</b>. ' : '') + (ex ? '<span style="color:var(--warn)">Er staan al resultaten voor deze week; opslaan overschrijft ze.</span>' : ''); };
  f.addEventListener('change', nameUpd); f.addEventListener('input', nameUpd); nameUpd();
  f.onsubmit = async e => {
    e.preventDefault();
    if (!f.p.value) { toast('Kies het project waar deze export bij hoort.', true); return; }
    const jaar = num(f.j.value), week = num(f.w.value);
    const perAgent = {};
    Object.entries(agents).forEach(([a, rr]) => { const z = zmatch(a); perAgent[norm(a) || 'onbekend'] = { naam: a, zzpId: z ? z.id : null, ...funnelOf(rr) }; });
    const id = (f.p.value + '_' + jaar + '-W' + String(week).padStart(2, '0'));
    if (await save('resultaten', id, { projectId: f.p.value, jaar, week, ...fu, perAgent, bron: filename, ingelezen: new Date().toISOString() })) { toast('Week ' + week + ' opgeslagen voor ' + (project(f.p.value)?.naam || '')); closeModal(); }
  };
}
function resultaatModal(id, preset) {
  const r = id ? S.resultaten[id] : (preset || { jaar: vorigeWeek().jaar, week: vorigeWeek().week });
  const fields = [
    { k: 'projectId', label: 'Project', type: 'select', full: true, options: [['', 'Kies…'], ...sortBy(list('projecten'), p => projLabel(p.id)).map(p => [p.id, projLabel(p.id)])] },
    { k: 'jaar', label: 'Jaar', type: 'number' }, { k: 'week', label: 'Week', type: 'number' },
    { k: 'pogingen', label: 'Contactpogingen', type: 'number' }, { k: 'gesproken', label: 'Bedrijven gesproken', type: 'number' },
    { k: 'afspraak', label: 'Afspraken (100)', type: 'number' }, { k: 'overdracht', label: 'Overdrachten (101)', type: 'number' },
    { k: 'terugbel', label: 'Terugbelafspraken (500)', type: 'number' }, { k: 'geenInteresse', label: 'Geen interesse (200-202)', type: 'number' },
  ];
  const ag = r.perAgent ? Object.values(r.perAgent) : [];
  const k = klant(project(r.projectId)?.klantId);
  const extra = id ? '<div class="facts"><div><b>' + pct(num(r.gesproken), num(r.pogingen)) + '%</b>gesproken / pogingen</div><div><b>' + pct(num(r.warm), num(r.gesproken)) + '%</b>warm / gesproken</div><div><b>' + nf(r.infomail) + '</b>infomail (501)</div><div><b>' + nf(r.terugbelverzoek) + '</b>terugbelverzoek (502)</div></div>'
    + (ag.length ? '<div class="tbl-wrap" style="margin-bottom:14px"><table><thead><tr><th>Beller</th><th class="n">Pogingen</th><th class="n">Gesproken</th><th class="n">Afspr.</th><th class="n">Overdr.</th></tr></thead><tbody>' + ag.map(a => '<tr><td>' + esc(a.zzpId && zzp(a.zzpId) ? zzp(a.zzpId).naam : a.naam) + '</td><td class="n">' + a.pogingen + '</td><td class="n">' + a.gesproken + '</td><td class="n">' + a.afspraak + '</td><td class="n">' + a.overdracht + '</td></tr>').join('') + '</tbody></table></div>' : '')
    + (k ? '<p class="sub">Rapportagebestand: <b>Rapportage ' + esc(k.naam) + ' wk ' + r.week + '.pdf</b>' + (r.bron ? ' · bron: ' + esc(r.bron) : '') + '</p>' : '') : '';
  const m = openModal('<form><div class="modal-head"><div><div class="eyebrow">Belresultaten</div><h2>' + (id ? esc(project(r.projectId)?.naam || '') + ' · week ' + r.week : 'Handmatig invoeren') + '</h2></div><button type="button" class="x" data-act="close" aria-label="Sluiten">×</button></div><div class="modal-body">' + extra + '<div class="form">' + fields.map(f => field(f, r[f.k])).join('') + '</div></div><div class="modal-foot">' + (id ? '<button type="button" class="btn danger" id="del">Verwijderen</button>' : '') + '<span class="spacer"></span><button type="button" class="btn" data-act="close">Annuleren</button><button type="submit" class="btn primary">Opslaan</button></div></form>', { wide: !!id });
  const f = m.querySelector('form');
  f.onsubmit = async e => {
    e.preventDefault();
    const d = readForm(f, fields);
    if (!d.projectId || !d.jaar || !d.week) { toast('Kies een project, jaar en week.', true); return; }
    const nid = d.projectId + '_' + d.jaar + '-W' + String(d.week).padStart(2, '0');
    const body = { ...(id ? S.resultaten[id] : {}), ...d, warm: num(d.afspraak) + num(d.overdracht) + num(d.terugbel) };
    if (id && id !== nid) await remove('resultaten', id);
    if (await save('resultaten', nid, body)) { closeModal(); toast('Opgeslagen'); }
  };
  const del = m.querySelector('#del');
  if (del) del.onclick = () => confirmInline(del, 'Resultaten verwijderen?', async () => { if (await remove('resultaten', id)) { closeModal(); toast('Verwijderd'); } });
}

/* ======================================================================
   Acties (event delegation)
   ====================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const [a, b, c, d4] = el.dataset.act.split(':');
  const actions = {
    close: closeModal,
    tab: () => { if (b === 'planning' && c) UI.weekStart = mondayOf(parseISO(c)); closeModal(); go(b); },
    wk: () => { UI.weekStart = b === '0' ? mondayOf(new Date()) : addDays(UI.weekStart, 7 * +b); render(); },
    newdienst: () => dienstModal(null, { datum: b || TODAY, zzpId: c || '' }),
    dienst: () => dienstModal(b),
    plan: () => dienstModal(null, { datum: TODAY, projectId: b }),
    confirmweek: confirmWeek,
    newproject: () => projectModal(null, { klantId: b || '', status: 'actief', type: klant(b)?.deliverable || 'afspraak' }),
    project: () => projectModal(b),
    pf: () => { UI.projFilter = b; render(); },
    newklant: () => klantModal(null), klant: () => klantModal(b),
    newzzp: () => zzpModal(null), zzp: () => zzpModal(b),
    newfact: () => factuurNieuwModal(b, c || ''),
    factuur: () => factuurModal(b),
    fstat: () => setFactStatus(b, c),
    fs: () => { UI.factSoort = b; UI.factStatus = 'alle'; render(); },
    fst: () => { UI.factStatus = b; render(); },
    kopieer: () => kopieerBriefing(b),
    fbsave: () => feedbackOpslaan(b),
    dsopen: () => { UI.dsOpen.has(b) ? UI.dsOpen.delete(b) : UI.dsOpen.add(b); render(); },
    bh: () => { UI.beheer = b; render(); },
    toonalles: () => { UI.toonAlles = !UI.toonAlles; render(); },
    dsplan: () => dienstModal(null, { projectId: b, datum: c || TODAY, zzpId: d4 || '' }),
    dssave: saveDagstart,
    newresult: () => resultaatModal(null), resultaat: () => resultaatModal(b),
  };
  if (actions[a]) { e.preventDefault(); actions[a](); }
});
document.addEventListener('focusout', e => { if (e.target.id === 'ds-note') saveDagstart(); });
document.addEventListener('change', e => { if (e.target.id === 'upl' && e.target.files.length) { handleFiles([...e.target.files]); e.target.value = ''; } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); handleFiles([...e.dataTransfer.files]); } });

(function boot() {
  const h = (location.hash || '').slice(1);
  let saved = null; try { saved = localStorage.getItem('link-tab'); } catch (e) { /* */ }
  UI.tab = TABS.some(t => t[0] === h) ? h : (TABS.some(t => t[0] === saved) ? saved : 'overzicht');
  renderTabs(); render();
  const start = st => {
    store = st;
    const mode = document.getElementById('mode');
    mode.textContent = st.mode === 'gedeeld' ? 'live gedeeld' : 'lokaal';
    mode.className = 'mode' + (st.mode === 'gedeeld' ? '' : ' local');
    mode.title = st.mode === 'gedeeld' ? 'Alle wijzigingen worden gedeeld met iedereen met toegang.' : 'Gegevens staan alleen in deze browser. Open het dashboard via claude.ai voor gedeelde opslag.';
    COLL.forEach(c => st.subscribe(c, data => { S[c] = data; S.loaded.add(c); render(); }));
    startMail();
  };
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('db').then(db => start(db ? dbStore(db) : localStore())).catch(() => start(localStore()));
    window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  } else start(localStore());
})();
})();
