services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: link
      POSTGRES_PASSWORD: link
      POSTGRES_DB: link_outreach
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U link']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://link:link@postgres:5432/link_outreach
      SESSION_SECRET: ${SESSION_SECRET:-verander-dit-in-productie-naar-iets-langs}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SEND_MODE: ${SEND_MODE:-demo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - '3000:3000'

volumes:
  pgdata:
