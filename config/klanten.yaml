# Opdrachtgevers van LINK.
# Bedragen excl. btw, per werkperiode van 4 weken (28 dagen).
# null = nog invullen. Het model toont dit als "ontbreekt" en rekent er niet mee.
#
# Velden:
#   pids                 campagne-PID's in Steam (loadRecord / CampagnePID)
#   fee_per_4wk          vaste fee per werkperiode
#   extra_per_lead       extra fee per resultaatcode 101 (lead / overdracht)
#   target_per_4wk       aantal resultaten per werkperiode
#   deliverable          omschrijving van wat we leveren
#   telt_als_resultaat   welke resultaatcodes tellen voor deze klant als resultaat
#   belstart             eerste beldag (jjjj-mm-dd); werkperiodes tellen vanaf hier

