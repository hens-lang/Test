    omzet_boekhouding: 12600
    pids: [11]
    fee_per_4wk: 1500
    extra_per_lead: 150   # per ingeplande afspraak (100), niet per lead met kortingscode
    extra_code: 100
    beldagen_per_week: 1   # vaste beldag
    target_per_4wk: 14
    targets_per_code: {100: 4, 101: 10}   # 1 afspraak per week + ca. 2-3 leads per week
    memo_classificatie: true   # bellers zetten alles op 101; afspraak wordt herkend uit de memo
    deliverable: afspraak (100) + lead (101)
    telt_als_resultaat: [100, 101]
    belstart: null

