# Opdrachtgevers van LINK.
# Bedragen excl. btw, per werkperiode van 4 weken (28 dagen).
# null = nog invullen. Het model toont dit als "ontbreekt" en rekent er niet mee.
#
# Velden:
#   pids                 campagne-PID's in Steam (loadRecord / CampagnePID)
#   fee_per_4wk          vaste fee per werkperiode
#   extra_per_lead       extra fee per resultaatcode 101 (lead / overdracht)
#   target_per_4wk       aantal resultaten per werkperiode
#   deliverable          omschrijving van wat we leveren
#   telt_als_resultaat   welke resultaatcodes tellen voor deze klant als resultaat
#   targets_per_code     optioneel, bv. {100: 4, 101: 10}: target per resultaatcode per 4 weken.
#                        Het stoplicht kijkt dan naar het onderdeel dat het meest achterloopt.
#   extra_code           resultaatcode waarvoor extra_per_lead betaald wordt (standaard 101; Moyee: 100)
#   pilot                {weken: 12, target: 10, fee: 4950}: pilot met vaste looptijd; target en
#                        voortgang over de hele pilot in plaats van per 4 weken
#   memo_classificatie   true: een resultaat met een afspraak in de memo telt als 100 (afspraak),
#                        anders als 101 (lead). Patronen in instellingen.yaml.
#   belstart             eerste beldag (jjjj-mm-dd); werkperiodes tellen vanaf hier.
#                        Leeg? Dan wordt hij afgeleid uit een verkoopfactuur ("werkperiode N, periode ...").
#   factuur_namen        naam zoals op onze verkoopfactuur, als die niet al de klantnaam bevat
#   omzet_boekhouding    controlecijfer: omzet excl. btw volgens de boekhouding (top 10, laatste 12 mnd,
#                        stand 1-10-2026). Datakwaliteit toont het verschil met de ingelezen facturen.
#   beldagen_per_week    vast belrooster, bv. 1 (één dag per week) of 0.5 (een ochtend). Leeg: het
#                        dashboard meet het uit de belpogingen. KPI's per beldag rekenen hiermee.
#   status               actief (standaard), pauze of gestopt. Alleen actieve klanten tellen mee
#                        in targets, stoplichten en de scenario-rekenaar; historie blijft zichtbaar.
#
# Verkoopfacturen (PDF in data/inbox) gaan voor: de opbrengst is dan het gefactureerde bedrag,
# verdeeld over de factuurperiode. Dagen zonder factuur worden geschat als fee / 28.

klanten:
