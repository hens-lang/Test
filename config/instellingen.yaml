# Algemene instellingen voor het LINK.-dashboard.

# Werkperiodes van 4 weken voor het totaaloverzicht tellen vanaf deze maandag.
# Per opdrachtgever tellen werkperiodes vanaf de eigen belstart.
werkperiode_anker: 2026-08-03

# Overige vaste kosten per maand (excl. btw). Worden per kalenderdag verdeeld
# en naar rato van de toegerekende belkosten over opdrachtgevers verdeeld.
# Echte facturen staan in config/kosten.yaml en gaan voor. null = nog invullen
# (of: laat null als er facturen in kosten.yaml staan; dan wordt de laatste factuur doorgeschat).
overige_kosten_per_maand:
  Steam Connect: null         # facturen in kosten.yaml (licenties + nummers + minuten)
  Data AdHocData: null        # jaarlicentie in kosten.yaml
  Data Apollo.io: null        # facturen in kosten.yaml

# Overige kosten gelden vanaf deze datum (eerdere dagen krijgen ze niet).
overige_kosten_vanaf: 2026-03-01

# Maanden zonder factuur schatten met het laatst bekende factuurbedrag van dezelfde post.
kosten_doorschatten: true

# Omrekenkoers voor facturen in USD (Apollo, Laravel). Pas aan naar je boekhouding.
wisselkoers_usd_eur: 0.86

# Beldag voor de uur-van-de-dag-analyse.
beldag_start_uur: 8
beldag_eind_uur: 17

# Focus-index: onder deze waarde kleurt hij rood.
focus_drempel: 0.8

# Stoplicht targets: prognose / target.
stoplicht_groen: 1.0
stoplicht_oranje: 0.8

# Werkdagen per week voor prognoses en "benodigd per resterende werkdag".
werkdagen_per_week: 5

# Scenario-rekenaar
scenario:
  tarief_nu: 25
  tarief_doel: 36

# Facturen zonder weeknummer ("Betreft: Week 33") worden toegewezen aan:
#   de week van de factuurdatum als die op do t/m zo valt, anders aan de week ervoor.
factuur_zelfde_week_vanaf_weekdag: 4   # 1 = maandag ... 7 = zondag

# Opbrengst:
#   facturen               = alleen wat echt gefactureerd is (verkoopfacturen in data/inbox: PDF of
#                            verkoopfacturen_mailbox.csv). Een factuur zonder periode telt voor
#                            28 dagen vanaf de factuurdatum.
#   facturen_en_schatting  = dagen zonder factuur aanvullen met fee / 28 (en leads x leadfee).
opbrengst_basis: facturen

# Verdeelsleutel van uren en kosten over opdrachtgevers:
#   steam_gekalibreerd = dagverdeling uit belregels, totaal per klant gelijk aan de beltijd per campagne
#                        in de Steam-contactstatistieken (contactstatistics_agents_*.xls). Aanbevolen.
#   belregels          = alleen naar rato van belregels per dag (zonder Steam-statistieken).
verdeelsleutel: steam_gekalibreerd

# Resultaat uit de memo (voor klanten met memo_classificatie: true in klanten.yaml).
# Een resultaat (bv. 101 'overgedragen') telt als afspraak (100) als de memo een van deze
# patronen bevat (hoofdletterongevoelig, reguliere expressies). Het tijdstempel waarmee Steam
# een memo begint (dd-mm-jjjj uu:mm:ss) wordt genegeerd; een datum met tijd zonder seconden
# (bv. "16-09-2026 10:00") telt wel als afspraak.
memo_afspraak_patronen:
  - '(?<!geen )afspraak'
  - 'ingepland'
  - '\btasting\b'
  - '(proeverij|tasting)\s+(is\s+|staat\s+)?(op\s+)?(gepland|ingepland|afgesproken)'
  - '(proeverij|tasting)\s+op\s+(maandag|dinsdag|woensdag|donderdag|vrijdag|\d)'
  - '\bmeeting\b'
  - '\bkennismaking(sgesprek)?\b'
  - '\bdemo\b'
  - '\b\d{1,2}-\d{1,2}-\d{4}\s+\d{1,2}[:.]\d{2}(?![:.]\d)'
  # datum in woorden met tijd: "do 20 augustus 09:30"
  - '\b\d{1,2}\s+(jan|feb|maart|mrt|apr|mei|jun|jul|aug|sep|okt|nov|dec)[a-z]*\b[^.\n]{0,25}\b\d{1,2}[:.]\d{2}\b'
  # proeverij/tasting en een concrete datum in dezelfde memo
  - '(proeverij|tasting)[\s\S]{0,300}?\b\d{1,2}\s+(jan|feb|maart|mrt|apr|mei|jun|jul|aug|sep|okt|nov|dec)[a-z]*\b'
  - '\b\d{1,2}\s+(jan|feb|maart|mrt|apr|mei|jun|jul|aug|sep|okt|nov|dec)[a-z]*\b[\s\S]{0,300}?(proeverij|tasting)'
